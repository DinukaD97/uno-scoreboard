<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNO Scoreboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#0b0b0c;
  --surface:#1a1a1c;
  --surface2:#262628;
  --line:#3d3d40;
  --text:#f5f5f2;
  --muted:#a3a3a6;
  --accent:#ffc400;
  --accent-ink:#241a00;
  --danger:#e8392e;
  --good:#2fa84f;
  --blue:#2f6feb;
  color-scheme: dark;
}

:root[data-theme="light"]{
  --bg:#f5f4f0;
  --surface:#ffffff;
  --surface2:#ececE8;
  --line:#d9d8d3;
  --text:#1c1c1d;
  --muted:#68686c;
  --accent:#c98a00;
  --accent-ink:#241a00;
  --danger:#c42a1e;
  --good:#238a44;
  --blue:#2458c4;
  color-scheme: light;
}

@media (prefers-color-scheme: light){
  :root[data-theme="system"]{
    --bg:#f5f4f0;
    --surface:#ffffff;
    --surface2:#ececE8;
    --line:#d9d8d3;
    --text:#1c1c1d;
    --muted:#68686c;
    --accent:#c98a00;
    --accent-ink:#241a00;
    --danger:#c42a1e;
    --good:#238a44;
    --blue:#2458c4;
    color-scheme: light;
  }
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  margin:0;
  padding:20px;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
input, textarea{user-select:text;}
.wrap{max-width:820px;margin:0 auto;}

h1,h2,h3{font-family:'Fraunces',Georgia,serif;text-wrap:balance;margin:0;}
h1{font-size:26px;font-weight:700;letter-spacing:-0.01em;}
.tagline{color:var(--muted);font-size:13px;margin-top:4px;}

.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tab{
  font-family:'IBM Plex Sans';font-size:14px;font-weight:500;color:var(--muted);
  background:none;border:none;padding:10px 14px;cursor:pointer;position:relative;top:1px;
  border-bottom:2px solid transparent;
}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.view{display:none;padding-top:18px;}
.view.active{display:block;}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
}
.card + .card{margin-top:14px;}

.row{display:flex;gap:10px;align-items:center;}
.row.wrap{flex-wrap:wrap;}
.grow{flex:1;}

input[type=text], input[type=number], select{
  font-family:'IBM Plex Sans';font-size:15px;color:var(--text);
  background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;width:100%;
}
input[type=number]{font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums;}
input:focus-visible, select:focus-visible, button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

button{
  font-family:'IBM Plex Sans';font-weight:600;font-size:14px;cursor:pointer;
  border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);
  padding:9px 14px;white-space:nowrap;
}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
button.danger{color:var(--danger);}
button:disabled{opacity:.45;cursor:not-allowed;}
button.icon{padding:7px 10px;}

.empty{color:var(--muted);font-size:14px;padding:28px 8px;text-align:center;}

.player-pill{
  display:inline-flex;align-items:center;gap:8px;background:var(--surface2);
  border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 6px;font-size:14px;
}
.dot{width:10px;height:10px;border-radius:50%;flex:none;}

.playerlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}

table{width:100%;border-collapse:collapse;}
th,td{text-align:left;padding:8px 6px;font-size:14px;border-bottom:1px solid var(--line);}
th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums;}
td.running{color:var(--muted);font-size:12px;}
th.group-sep, td.group-sep{border-left:1px solid var(--line);}

.totals-bar{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-top:4px;}
.total-tile{
  flex:1;min-width:110px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:12px;text-align:center;
}
.total-tile.leader{border-color:var(--good);}
.total-tile.over{border-color:var(--danger);}
.total-tile .name{font-size:13px;color:var(--muted);margin-bottom:4px;}
.total-tile .score{font-family:'IBM Plex Mono';font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;}
.total-tile .score.over{color:var(--danger);}

.banner{
  background:var(--good);color:#ffffff;border-radius:10px;padding:14px 16px;margin-bottom:14px;
  font-weight:600;font-family:'IBM Plex Sans';display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.banner button{background:#14321e;color:#fff;border-color:#14321e;}

.toss-result{
  margin-top:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.first-move-line{margin-top:8px;}
.first-move-tag{font-size:13px;}

label.field{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}

.tally-panel{
  margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;
}
.tally-display-row{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
}
.tally-display{
  flex:1;font-family:'IBM Plex Mono';font-size:28px;font-weight:600;color:var(--accent);
  text-align:right;letter-spacing:.02em;transform-origin:right center;
}
.tally-display.pulse{animation:tally-pop .15s ease;}
@keyframes tally-pop{0%{transform:scale(1.18);}100%{transform:scale(1);}}
.tally-backspace-btn{
  font-size:16px;padding:6px 10px;background:var(--surface2);
}
.tally-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.tally-key-btn, .tally-commit-btn{
  font-family:'IBM Plex Mono';font-size:18px;font-weight:600;padding:12px 4px;
}
.tally-commit-btn{background:var(--accent);color:var(--accent-ink);}
.tally-commit-wide{width:100%;padding:14px 4px;margin-bottom:8px;}
.tally-card-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:10px 4px;font-family:'IBM Plex Mono';font-size:16px;font-weight:600;
}
.tally-btn-title{font-size:9px;font-family:'IBM Plex Sans';font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.tally-btn-pts{font-size:16px;}
.tally-subtotal{font-family:'IBM Plex Mono';color:var(--text);}
.tally-history-display{font-family:'IBM Plex Mono';font-size:12px;word-break:break-word;}
.tally-subtotal.pulse{display:inline-block;animation:tally-pop .15s ease;}
.tally-key-btn, .tally-commit-btn, .tally-card-btn, .tally-backspace-btn{transition:transform .08s ease;}
.tally-key-btn:active, .tally-commit-btn:active, .tally-card-btn:active, .tally-backspace-btn:active{transform:scale(0.92);}

.hist-item{cursor:pointer;}
.hist-item:hover{background:var(--surface2);}
.hist-item .row{justify-content:space-between;}
.sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
.muted{color:var(--muted);font-size:13px;}
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:1000;
}
.modal-overlay[hidden]{display:none;}
.modal-box{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:360px;width:100%;
}
.modal-message{font-size:15px;line-height:1.4;}
a{color:var(--accent);}
.back{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:8px;}
.back:hover{color:var(--text);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:6px;border:2px solid var(--bg);}
::-webkit-scrollbar-track{background:var(--bg);}
</style>
</head>
<body>

<div class="wrap">
  <h1 data-tkey="app_title">UNO Scoreboard</h1>

  <div class="tabs">
    <button class="tab active" data-view="match" data-tkey="tab_match">Current Match</button>
    <button class="tab" data-view="players" data-tkey="tab_players">Players</button>
    <button class="tab" data-view="history" data-tkey="tab_history">History</button>
    <button class="tab" data-view="howto" data-tkey="tab_howto">How To Play</button>
    <button class="tab" data-view="about" data-tkey="tab_about">About</button>
    <button class="tab" data-view="settings" data-tkey="tab_settings">Settings</button>
  </div>

  <div class="view active" id="view-match"></div>
  <div class="view" id="view-players"></div>
  <div class="view" id="view-history"></div>
  <div class="view" id="view-about"></div>
  <div class="view" id="view-howto"></div>
  <div class="view" id="view-settings"></div>
</div>

<div class="modal-overlay" id="confirm-modal-overlay" hidden>
  <div class="modal-box">
    <div class="modal-message"></div>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:16px;">
      <button type="button" id="modal-cancel-btn">Cancel</button>
      <button type="button" class="danger" id="modal-confirm-btn">Yes</button>
    </div>
  </div>
</div>

      howto_object_text: "සෑම වටයක ම ඔබේ අතේ ඇති සියලු ම කාඩ් සෙල්ලම් කර මුලින්ම ඉවර කරන්න. වටයක් අවසන් වූ විට, අනෙක් අයගේ අතේ ඉතිරි කාඩ් අනුව ඔබට ලකුණු ලැබේ. මුලින් ම <strong>ලකුණු 500</strong> ලබා ගන්නා කෙනා ජය ගනී. — මෙම යෙදුම මඟින් එම එකතුව සහ ඉතිහාසය ස්වයංක්‍රීයව සටහන් කර ගනියි.",

      howto_setup_heading: "ආරම්භය",
      howto_setup_text: "ආරම්භයේ දී සෑම අයෙකු ම කුට්ටියෙන් කාඩ්පතක් අදියි. වැඩිම වටිනාකම ඇති කෙනා කාඩ් බෙදන්නා වේ. කාඩ් බෙදන්නා කට්ටලය මිශ්‍ර කර සෑම ක්‍රීඩකයෙකුට ම කාඩ් 7 ක් බැගින් බෙදයි. ඉතිරි කාඩ් උඩුයටිකුරුව තබා අදින කුට්ටිය සාදයි. එහි උඩින් ම ඇති කාඩ්පත පෙරළා දැමීමෙන් පෙරළා දැමීමේ කුට්ටිය සාදයි. (එය Wild Draw Four කාඩ් එකක් නම්, එය නැවත කට්ටලයට දමා මිශ්‍ර කර අලුත් කාඩ්පතක් පෙරළිය යුතු ය.)",

      howto_turn_text: "සෙල්ලම පටන් ගන්නේ කාඩ් බෙදන්නාගේ වම් පසින් වන අතර, වම් දෙසට ගමන් කරයි. ඔබේ වාරයේදී, පෙරළා දැමීමේ කුට්ටියේ උඩින්ම ඇති කාඩ්පතේ <strong>වර්ණය</strong>, <strong>අංකය</strong>, හෝ <strong>සලකුණ</strong> අනුව ගැලපෙන කාඩ්පතක් දමා සෙල්ලම් කළ යුතු ය. නැතහොත් Wild කාඩ්පතක් ක්‍රීඩා කළ හැකි ය. ගැලපෙන කාඩ්පතක් නැද්ද? අදින කුට්ටියෙන් එක් කාඩ්පතක් ගන්න. එය ගැලපේ නම් ක්‍රීඩා කළ හැකි ය. නැත්නම් ඔබේ වාරය අවසන් වේ. සෙල්ලම අතරමඟ දී අදින කුට්ටිය හිස් වුවහොත්, පෙරළා දැමීමේ කුට්ටිය (එහි උඩින්ම ඇති කාඩ්පත පමණක් එහි ඉතිරි කරමින්) මිශ්‍ර කර සෙල්ලම දිගටම කරගෙන යා යුතු ය. ඔබට දැමීමට කාඩ්පතක් තිබුණත් එය ක්‍රීඩා නොකර (<strong>reneging</strong>) අදින කුට්ටියෙන් කාඩ්පතක් ඇදීම ත් සිදු කළ හැකි ය. එසේ අදින කාඩ්පත ගැලපේ නම් එය දැමිය හැකි ය. නමුත් ඉන්පසු ඔබේ අතේ ඇති වෙනත් කාඩ්පතක් එම වාරයේදී දැමිය නොහැකි ය.",

      howto_wild4_name: "Wild Draw Four",
      howto_wild4_effect: "සෙල්ලම් කරන වර්ණය වෙනස් කරයි. ඊළඟ කෙනා කාඩ් 4 ක් කුට්ටියෙන් ගත යුතු අතර ඔහුගේ වාරය ද මඟ හැරේ. වත්මන් සෙල්ලම් කරන වර්ණයට ගැලපෙන කාඩ්පතක් ඔබේ අතේ නැති විට පමණක් මෙය ක්‍රීඩා කළ හැකි ය. එසේ නොවී අභියෝගයට ලක් වී වරදකරු වුවහොත්, ඔබ ම කාඩ් 4 ක් කුට්ටියෙන් ඇදිය යුතු ය. ඔබ නිවැරදි නම්, අභියෝග කළ කෙනා කාඩ් 4 ක් සහ තවත් අමතර කාඩ් 2 ක් ද ඇදිය යුතු ය. එසේ අභියෝග කළ හැක්කේ මෙම කාඩ් පත දැමූ කෙනාට පසු ව සෙල්ලම් කරන කෙනාට පමණි. එම පසු ව සෙල්ලම් කරන කෙනා කාඩ්පතක් දැමීමට පෙර අභියෝග කරන්නේ නම් එය සිදු කළ යුතු ය. අභියෝග කරන්නේ නම්, එසේ කළ පසු Wild Draw Four දැමූ කෙනා ඔහුගේ අතෙහ් ඇති කාඩ්පත් අභියෝග කළ කෙනාට පමණක් පෙන්විය යුතු ය.",
      howto_uno_heading: "\"UNO\" කීම සහ වටය අවසන් කිරීම",

      howto_variant_multitable: "<strong>බහු-මේස තරඟාවලි</strong> — ක්‍රීඩකයින් 8 ක් සිටින විට, ක්‍රීඩකයින් 4 බැගින් වූ මේස දෙකක් එකවර ක්‍රියාත්මක වේ. මේස දෙකේ දී ම ජයග්‍රහණය කරන දෙදෙනා ඉහත පැහැදිලි කර දුන් ක්‍රීඩකයින් දෙදෙනෙක් සෙල්ලම් කරන ආකාරයට ක්‍රීඩා කර ජයග්‍රාහකයා තීරණය කරයි.",

  function t(key, vars){
    var dict = STRINGS[lang] || {};
    var str = (key in dict) ? dict[key] : ((STRINGS.en && STRINGS.en[key]) || key);
    if(vars){
      Object.keys(vars).forEach(function(k){
        str = str.split('{'+k+'}').join(vars[k]);
      });
    }
    return str;
  }
  function applyStaticText(){
    document.documentElement.lang = lang;
    document.documentElement.dataset.theme = theme;
    document.title = t('app_title');
    document.querySelectorAll('[data-tkey]').forEach(function(elm){
      elm.textContent = t(elm.dataset.tkey);
    });
  }

  var state = { players: [], matches: [], activeMatches: [], activeMatchId: null };
  var dataFilePath = '';

  function migrateState(s){
    if(!Array.isArray(s.activeMatches)){
      s.activeMatches = s.current ? [s.current] : [];
      s.activeMatchId = s.current ? s.current.id : null;
    }
    delete s.current;
    if(!s.players) s.players = [];
    if(!s.matches) s.matches = [];
    return s;
  }

  async function loadState(){
    try{
      var raw = await window.scoreboardAPI.load();
      if(raw) return migrateState(JSON.parse(raw));
    }catch(e){ console.error(e); }
    // One-time migration from the old localStorage-based version.
    try{
      var legacy = localStorage.getItem('uno-scoreboard-v1');
      if(legacy){
        var migrated = JSON.parse(legacy);
        localStorage.removeItem('uno-scoreboard-v1');
        return migrateState(migrated);
      }
    }catch(e){}
    return { players: [], matches: [], activeMatches: [], activeMatchId: null };
  }
  function getActiveMatch(){
    return state.activeMatches.find(function(m){ return m.id === state.activeMatchId; }) || null;
  }
  function save(){
    try{ window.scoreboardAPI.save(JSON.stringify(state)); }catch(e){ console.error(e); }
  }
  function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function showConfirm(message, onYes){
    var overlay = document.getElementById('confirm-modal-overlay');
    overlay.querySelector('.modal-message').textContent = message;
    overlay.hidden = false;
    var yesBtn = document.getElementById('modal-confirm-btn');
    var cancelBtn = document.getElementById('modal-cancel-btn');
    yesBtn.textContent = t('modal_yes');
    cancelBtn.textContent = t('modal_cancel');
    function cleanup(){
      overlay.hidden = true;
      yesBtn.removeEventListener('click', onYesClick);
      cancelBtn.removeEventListener('click', onCancelClick);
    }
    function onYesClick(){ cleanup(); onYes(); }
    function onCancelClick(){ cleanup(); }
    yesBtn.addEventListener('click', onYesClick);
    cancelBtn.addEventListener('click', onCancelClick);
  }
  function colorFor(playerId){
    var idx = state.players.findIndex(function(p){return p.id===playerId;});
    if(idx<0) idx = 0;
    return PALETTE[idx % PALETTE.length];
  }
  function playerName(id){
    var p = state.players.find(function(p){return p.id===id;});
    return p ? p.name : '(removed player)';
  }

  // ---------- tabs ----------
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      tabs.forEach(function(x){x.classList.remove('active');});
      t.classList.add('active');
      document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
      document.getElementById('view-'+t.dataset.view).classList.add('active');
      renderActiveView(t.dataset.view);
    });
  });

  function renderActiveView(view){
    if(view==='players') renderPlayers();
    if(view==='history') renderHistory();
    if(view==='match') renderMatch();
    if(view==='about') renderAbout();
    if(view==='howto') renderHowTo();
    if(view==='settings') renderSettings();
  }

  // ================= PLAYERS =================
  function renderPlayers(){
    var el = document.getElementById('view-players');
    var rows = state.players.map(function(p){
      return '<div class="player-pill">' +
        '<span class="dot" style="background:'+colorFor(p.id)+'"></span>' +
        '<span>'+esc(p.name)+'</span>' +
        '<button class="icon danger" data-remove-player="'+p.id+'" title="'+t('remove_player_title')+'" aria-label="'+t('remove_player_aria',{name:esc(p.name)})+'">✕</button>' +
        '</div>';
    }).join('');

    el.innerHTML =
      '<div class="card">' +
        '<div class="sectionhead"><h2 style="font-size:18px;">'+t('roster_heading')+'</h2><span class="muted">'+t('players_count',{n:state.players.length})+'</span></div>' +
        '<form id="add-player-form" class="row">' +
          '<input type="text" id="new-player-name" class="grow" placeholder="'+t('player_name_placeholder')+'" maxlength="24" autocomplete="off">' +
          '<button class="primary" type="submit">'+t('add_btn')+'</button>' +
        '</form>' +
        (state.players.length ? '<div class="playerlist">'+rows+'</div>' : '<div class="empty">'+t('no_players_empty')+'</div>') +
      '</div>' +
      '<div class="card">' +
        '<div class="sectionhead"><h2 style="font-size:15px;">'+t('save_data_heading')+'</h2></div>' +
        '<div class="muted" style="margin-bottom:10px;word-break:break-all;">'+esc(dataFilePath || t('save_data_loading'))+'</div>' +
        '<div class="muted" style="margin-bottom:10px;">'+t('save_data_note')+'</div>' +
        '<button id="reveal-data-btn">'+t('show_in_file_manager')+'</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="sectionhead"><h2 style="font-size:15px;">'+t('backup_heading')+'</h2></div>' +
        '<div class="muted" style="margin-bottom:10px;">'+t('backup_note')+'</div>' +
        '<div class="row" style="gap:8px;flex-wrap:wrap;">' +
          '<button id="export-backup-btn">'+t('export_backup_btn')+'</button>' +
          '<button id="import-backup-btn">'+t('import_backup_btn')+'</button>' +
        '</div>' +
      '</div>';

    var revealBtn = document.getElementById('reveal-data-btn');
    if(revealBtn) revealBtn.addEventListener('click', function(){
      try{ window.scoreboardAPI.reveal(); }catch(e){}
    });

    var exportBackupBtn = document.getElementById('export-backup-btn');
    if(exportBackupBtn) exportBackupBtn.addEventListener('click', async function(){
      try{
        var result = await window.scoreboardAPI.exportBackup(JSON.stringify(state, null, 2));
        if(result && result.ok) alert(t('backup_saved_to',{path:result.path}));
      }catch(e){ alert(t('backup_export_failed')); }
    });

    var importBackupBtn = document.getElementById('import-backup-btn');
    if(importBackupBtn) importBackupBtn.addEventListener('click', async function(){
      try{
        var result = await window.scoreboardAPI.importBackup();
        if(!result || !result.ok) return;
        var parsed;
        try{ parsed = JSON.parse(result.content); }catch(e){ alert(t('backup_invalid_json')); return; }
        if(!parsed || !Array.isArray(parsed.players) || !Array.isArray(parsed.matches)){
          alert(t('backup_invalid_format'));
          return;
        }
        showConfirm(t('backup_replace_confirm'), function(){
          state = migrateState(parsed);
          save();
          alert(t('backup_imported'));
          renderPlayers();
          if(getActiveMatch()) renderMatch();
        });
      }catch(e){ alert(t('backup_import_failed')); }
    });

    document.getElementById('add-player-form').addEventListener('submit', function(e){
      e.preventDefault();
      var inp = document.getElementById('new-player-name');
      var name = inp.value.trim();
      if(!name) return;
      if(state.players.some(function(p){return p.name.toLowerCase()===name.toLowerCase();})){
        inp.value=''; inp.placeholder=t('name_exists_placeholder'); return;
      }
      state.players.push({id: uid(), name: name});
      save(); inp.value=''; renderPlayers();
      if(getActiveMatch()) renderMatch();
    });

    el.querySelectorAll('[data-remove-player]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.dataset.removePlayer;
        var inAnyActiveMatch = state.activeMatches.some(function(m){ return m.playerIds.includes(id); });
        if(inAnyActiveMatch){
          alert(t('cannot_remove_active'));
          return;
        }
        state.players = state.players.filter(function(p){return p.id!==id;});
        save(); renderPlayers();
      });
    });
  }

  // ================= CURRENT MATCH =================
  function roundRunningTotals(match){
    // returns array (one per round) of {playerId: cumulativeTotal}
    var running = {};
    match.playerIds.forEach(function(id){ running[id]=0; });
    return match.rounds.map(function(round){
      match.playerIds.forEach(function(id){
        running[id] += (round.scores[id]||0);
      });
      return Object.assign({}, running);
    });
  }
  function roundWinner(match, round){
    if(round.winnerId && match.playerIds.includes(round.winnerId)) return round.winnerId;
    var best = null;
    match.playerIds.forEach(function(id){
      var s = round.scores[id]||0;
      if(s>0 && (best===null || s>(round.scores[best]||0))) best = id;
    });
    return best;
  }
  function computeTotals(match){
    var cum = roundRunningTotals(match);
    var totals = {};
    match.playerIds.forEach(function(id){ totals[id]=0; });
    if(cum.length) totals = cum[cum.length-1];
    return totals;
  }
  function matchWinner(match){
    var totals = computeTotals(match);
    var limit = match.winLimit || LIMIT;
    var over = match.playerIds.filter(function(id){ return totals[id] >= limit; });
    if(over.length===0) return null;
    // First to the limit wins. If more than one player crosses in the same round, the highest total wins.
    var best = over.slice().sort(function(a,b){ return totals[b]-totals[a]; })[0];
    return best;
  }

  function renderMatch(){
    var el = document.getElementById('view-match');
    var match = getActiveMatch();
    if(!match){
      renderMatchSetup(el);
    } else {
      renderMatchBoard(el, match);
    }
  }

              '<button type="button" class="icon danger" data-discard-paused="'+m.id+'" title="'+t('discard_paused_title')+'" aria-label="'+t('discard_paused_aria')+'">✕</button>' +

        '<span class="dot" style="background:'+colorFor(p.id)+'"></span>' +
        '<span>'+esc(p.name)+'</span>' +

    }).join('');

    el.innerHTML = pausedList +
      '<div class="card">' +
        '<div class="sectionhead"><h2 style="font-size:18px;">'+t('start_match_heading')+'</h2></div>' +
        '<div class="muted" style="margin-bottom:10px;">'+t('pick_who_playing')+'</div>' +
        '<div class="playerlist" id="setup-checks">'+checks+'</div>' +
        '<div class="row" style="margin-top:16px;align-items:center;gap:8px;">' +
          '<label for="win-limit-input" class="muted" style="margin:0;">'+t('win_at_label')+'</label>' +
          '<input type="number" id="win-limit-input" value="'+LIMIT+'" min="50" step="50" style="width:90px;">' +
          '<span class="muted">'+t('pts_label')+'</span>' +
        '</div>' +
        '<div class="row" style="margin-top:16px;">' +
          '<button type="button" id="toss-btn">'+t('pick_dealer_btn')+'</button>' +
        '</div>' +
        '<div id="toss-result"></div>' +
        '<div class="row" style="margin-top:16px;">' +
          '<button class="primary grow" id="start-match-btn">'+t('start_match_btn')+'</button>' +
        '</div>' +
      '</div>';
    attachPausedListeners(el);

    var tossPick = null;
    var tossResultEl = el.querySelector('#toss-result');

    function renderTossResult(){
      if(!tossPick){ tossResultEl.innerHTML = ''; return; }
      tossResultEl.innerHTML =
        '<div class="toss-result">' +
          '<span class="dot" style="background:'+colorFor(tossPick)+';"></span>' +
          '<span>'+t('dealer_announcement',{name:esc(playerName(tossPick))})+'</span>' +
          '<button type="button" class="icon" id="retoss-btn">'+t('pick_again_btn')+'</button>' +
        '</div>';
      tossResultEl.querySelector('#retoss-btn').addEventListener('click', doToss);
    }

    function doToss(){
      var ids = Array.from(el.querySelectorAll('#setup-checks input:checked')).map(function(c){return c.value;});
      if(ids.length < 2){ alert(t('select_2_first')); return; }
      tossPick = ids[Math.floor(Math.random() * ids.length)];
      renderTossResult();
    }

    el.querySelector('#toss-btn').addEventListener('click', doToss);
    el.querySelectorAll('#setup-checks input').forEach(function(cb){
      cb.addEventListener('change', function(){
        if(tossPick){ tossPick = null; renderTossResult(); }
      });

    el.querySelector('#start-match-btn').addEventListener('click', function(){
      var ids = Array.from(el.querySelectorAll('#setup-checks input:checked')).map(function(c){return c.value;});

      var firstPlayerId = (tossPick && ids.includes(tossPick)) ? tossPick : null;
      var winLimitInput = parseInt(el.querySelector('#win-limit-input').value, 10);
      var winLimit = (!isNaN(winLimitInput) && winLimitInput >= 50) ? winLimitInput : LIMIT;
      var newMatch = { id: uid(), playerIds: ids, rounds: [], startedAt: Date.now(), finished: false, firstPlayerId: firstPlayerId, winLimit: winLimit };
      state.activeMatches.push(newMatch);

  function attachPausedListeners(el){
    el.querySelectorAll('[data-resume]').forEach(function(row){
      row.addEventListener('click', function(e){

        state.activeMatchId = row.dataset.resume;
        save(); renderMatch();
      });
    });
    el.querySelectorAll('[data-discard-paused]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.dataset.discardPaused;
        showConfirm(t('discard_paused_confirm'), function(){
          state.activeMatches = state.activeMatches.filter(function(m){ return m.id!==id; });
          save(); renderMatch();
        });
      });
    });
  }

  function renderMatchBoard(el, match){
    var running = roundRunningTotals(match);
    var totals = computeTotals(match);
    var winnerId = matchWinner(match);
    var finished = !!winnerId;
    var winLimit = match.winLimit || LIMIT;

    var tiles = match.playerIds.map(function(id){
      var t = totals[id];
      var isOver = t >= winLimit;
      var isWinnerDisplay = finished && id===winnerId;
      var isFirst = match.firstPlayerId === id;
      return '<div class="total-tile '+(isWinnerDisplay?'leader':'')+' '+(isOver && !isWinnerDisplay?'over':'')+'">' +
        '<div class="name">'+(isFirst?'🎲 ':'')+'<span class="dot" style="background:'+colorFor(id)+';display:inline-block;margin-right:5px;vertical-align:middle;"></span>'+esc(playerName(id))+'</div>' +
        '<div class="score '+(isOver && !isWinnerDisplay?'over':'')+'">'+t+'</div>' +
      '</div>';
    }).join('');

    var banner = '';
    if(finished){
      banner = '<div class="banner">'+t('match_win_banner',{name:esc(playerName(winnerId)),limit:winLimit,points:totals[winnerId]})+
        '<button id="save-match-btn">'+t('save_new_match_btn')+'</button></div>';
    }

    var roundRows = match.rounds.map(function(round, idx){
      var cum = running[idx];
      var winnerOfRound = roundWinner(match, round);
      var pts = winnerOfRound ? (round.scores[winnerOfRound]||0) : 0;
      var toGo = winnerOfRound ? winLimit - cum[winnerOfRound] : null;
      return '<tr>' +
        '<td>'+(idx+1)+'</td>' +
        '<td><span class="dot" style="background:'+(winnerOfRound?colorFor(winnerOfRound):'transparent')+';display:inline-block;margin-right:5px;vertical-align:middle;"></span>'+(winnerOfRound?esc(playerName(winnerOfRound)):'—')+'</td>' +
        '<td class="num">'+pts+'</td>' +
        '<td class="num">'+(toGo===null?'—':(toGo>0?'<span class="running">'+t('to_go',{n:toGo})+'</span>':'<span class="running">'+t('reached_limit',{limit:winLimit})+'</span>'))+'</td>' +
        '<td><button class="icon danger" data-del-round="'+idx+'" '+(finished?'disabled':'')+' aria-label="'+t('delete_round_aria',{n:idx+1})+'">✕</button></td>' +
      '</tr>';
    }).join('');

    var roundsTable = match.rounds.length ?
      '<div style="overflow-x:auto;"><table>' +
        '<tr><th>'+t('col_round')+'</th><th>'+t('col_winner')+'</th><th class="num">'+t('col_points')+'</th><th class="num">'+t('col_remaining')+'</th><th></th></tr>' +
        roundRows +
      '</table></div>'
      : '<div class="empty">'+t('no_rounds_empty')+'</div>';

    var winnerEntryBlocks = match.playerIds.map(function(id){
      var tallyBtn = finished ? '' :
        '<button type="button" class="icon tally-toggle-btn" data-player="'+id+'" title="'+t('tally_cards_title')+'" aria-label="'+t('tally_cards_aria',{name:esc(playerName(id))})+'">🧮</button>';
      var tallyPanel = finished ? '' :
        '<div class="tally-panel" id="tally-panel-'+id+'" hidden data-subtotal="0" data-history="[]" data-entered="0" data-locked="0">' +
          '<div class="tally-display-row">' +
            '<button type="button" class="icon tally-backspace-btn" title="'+t('backspace_title')+'" aria-label="'+t('backspace_aria')+'">⌫</button>' +
            '<div class="tally-display">0</div>' +
          '</div>' +
          '<div class="tally-keypad">' +
            [7,8,9,4,5,6,1,2,3].map(function(n){
              return '<button type="button" class="tally-key-btn" data-digit="'+n+'">'+n+'</button>';
            }).join('') +
            '<button type="button" class="tally-card-btn tally-value-btn" data-value="20"><span class="tally-btn-title">'+t('skiprevd2_label')+'</span><span class="tally-btn-pts">20</span></button>' +
            '<button type="button" class="tally-key-btn" data-digit="0">0</button>' +
            '<button type="button" class="tally-card-btn tally-value-btn" data-value="50"><span class="tally-btn-title">'+t('wild_label')+'</span><span class="tally-btn-pts">50</span></button>' +
          '</div>' +
          '<button type="button" class="tally-commit-btn tally-commit-wide">+</button>' +
          '<div class="muted tally-history-display">—</div>' +
          '<div class="row" style="justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:8px;">' +
            '<div class="muted">'+t('tally_label')+' <strong class="tally-subtotal">0</strong></div>' +
            '<div class="row" style="gap:6px;">' +
              '<button type="button" class="icon tally-undo-btn">'+t('undo_btn')+'</button>' +
              '<button type="button" class="icon tally-close-btn">'+t('close_btn')+'</button>' +
              '<button type="button" class="primary tally-add-btn">'+t('add_to_score_btn')+'</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      return '<div class="winner-entry" data-player="'+id+'" hidden>' +
        '<div class="muted" style="margin-bottom:8px;">'+t('how_many_points_question',{name:esc(playerName(id))})+'</div>' +
        '<div class="row" style="justify-content:space-between;align-items:baseline;gap:6px;">' +
          '<label class="field" style="margin-bottom:0;">'+esc(playerName(id))+'</label>' +
          tallyBtn +
        '</div>' +
        '<input type="number" inputmode="numeric" class="round-score-input" data-player="'+id+'" placeholder="0" '+(finished?'disabled':'')+'>' +
        tallyPanel +
      '</div>';
    }).join('');

    el.innerHTML =
      banner +
      '<div class="card">' +
        '<div class="sectionhead"><h2 style="font-size:18px;">'+t('totals_heading')+'</h2><span class="muted">'+t('win_at_rounds_summary',{limit:winLimit,n:match.rounds.length})+'</span></div>' +
        '<div class="totals-bar">'+tiles+'</div>' +
        (match.firstPlayerId ? '<div class="muted first-move-line">'+t('dealer_label',{name:esc(playerName(match.firstPlayerId))})+'</div>' : '') +
      '</div>' +
      '<div class="card">' +
        '<div class="sectionhead"><h2 style="font-size:18px;">'+t('rounds_heading')+'</h2>' +
          '<div class="row" style="gap:6px;flex-wrap:wrap;">' +
            (finished ? '' : '<button type="button" id="pause-match-btn">'+t('pause_btn')+'</button>') +
            (finished ? '' : '<button type="button" class="primary" id="finish-match-btn">'+t('finish_btn')+'</button>') +
            '<button class="danger" id="discard-match-btn">'+t('discard_match_btn')+'</button>' +
          '</div>' +
        '</div>' +
        roundsTable +
      '</div>' +
      (finished ? '' :
      '<div class="card">' +
        '<h2 style="font-size:16px;margin-bottom:10px;">'+t('add_round_heading',{n:match.rounds.length+1})+'</h2>' +
        '<div class="muted" style="margin-bottom:6px;">'+t('who_won_question')+'</div>' +
        '<div class="playerlist" id="round-winner-picks" style="margin-bottom:14px;">' +
          match.playerIds.map(function(id){
            return '<label class="player-pill" style="cursor:pointer;">' +
              '<input type="radio" name="round-winner" value="'+id+'" style="margin:0;">' +
              '<span class="dot" style="background:'+colorFor(id)+'"></span>' +
              '<span>'+esc(playerName(id))+'</span>' +
            '</label>';
          }).join('') +
        '</div>' +
        winnerEntryBlocks +
        '<div class="row" style="margin-top:14px;" id="add-round-row" hidden>' +
          '<button class="primary grow" id="add-round-btn">'+t('add_round_btn')+'</button>' +
        '</div>' +
      '</div>');

    if(!finished){
      el.querySelectorAll('input[name="round-winner"]').forEach(function(radio){
        radio.addEventListener('change', function(){
          el.querySelectorAll('.winner-entry').forEach(function(div){
            div.hidden = (div.dataset.player !== radio.value);
          });
          el.querySelector('#add-round-row').hidden = false;
        });
      });

      el.querySelector('#add-round-btn').addEventListener('click', function(){
        var checkedWinner = el.querySelector('input[name="round-winner"]:checked');
        if(!checkedWinner) return;
        var winnerId = checkedWinner.value;
        var input = el.querySelector('.round-score-input[data-player="'+winnerId+'"]');
        var v = parseInt(input.value, 10);
        var pts = isNaN(v) ? 0 : v;
        var scores = {};
        match.playerIds.forEach(function(id){ scores[id] = (id===winnerId) ? pts : 0; });
        match.rounds.push({ scores: scores, winnerId: winnerId });
        save(); renderMatch();
      });

      function tallyPulse(elm){
        elm.classList.remove('pulse');
        void elm.offsetWidth;
        elm.classList.add('pulse');
      }

      function tallyRenderHistory(panel){
        var history = JSON.parse(panel.dataset.history || '[]');
        var historyEl = panel.querySelector('.tally-history-display');
        historyEl.textContent = history.length ? history.join(' + ') : '—';
      }

      el.querySelectorAll('.tally-toggle-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.dataset.player;
          var panel = document.getElementById('tally-panel-'+id);
          if(!panel) return;
          var isOpen = !panel.hidden;
          el.querySelectorAll('.tally-panel').forEach(function(p){ p.hidden = true; });
          if(!isOpen){
            panel.hidden = false;
            panel.dataset.subtotal = '0';
            panel.dataset.history = '[]';
            panel.dataset.entered = '0';
            panel.dataset.locked = '0';
            panel.querySelector('.tally-subtotal').textContent = '0';
            panel.querySelector('.tally-display').textContent = '0';
            tallyRenderHistory(panel);
          }
        });
      });

      el.querySelectorAll('.tally-key-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var panel = btn.closest('.tally-panel');
          var digit = parseInt(btn.dataset.digit, 10) || 0;
          var entered = panel.dataset.locked === '1' ? digit : (parseInt(panel.dataset.entered, 10) || 0) * 10 + digit;
          panel.dataset.entered = String(entered);
          panel.dataset.locked = '0';
          var display = panel.querySelector('.tally-display');
          display.textContent = String(entered);
          tallyPulse(display);
        });
      });

      el.querySelectorAll('.tally-backspace-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var panel = btn.closest('.tally-panel');
          var entered = Math.floor((parseInt(panel.dataset.entered, 10) || 0) / 10);
          panel.dataset.entered = String(entered);
          panel.dataset.locked = '0';
          var display = panel.querySelector('.tally-display');
          display.textContent = String(entered);
          tallyPulse(display);
        });
      });

      el.querySelectorAll('.tally-commit-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var panel = btn.closest('.tally-panel');
          var entered = parseInt(panel.dataset.entered, 10) || 0;
          if(entered <= 0) return;
          var history = JSON.parse(panel.dataset.history || '[]');
          history.push(entered);
          panel.dataset.history = JSON.stringify(history);
          var subtotal = (parseInt(panel.dataset.subtotal, 10) || 0) + entered;
          panel.dataset.subtotal = String(subtotal);
          var subtotalEl = panel.querySelector('.tally-subtotal');
          subtotalEl.textContent = String(subtotal);
          tallyPulse(subtotalEl);
          panel.dataset.entered = '0';
          panel.dataset.locked = '0';
          var display = panel.querySelector('.tally-display');
          display.textContent = '0';
          tallyPulse(display);
          tallyRenderHistory(panel);
        });
      });

      el.querySelectorAll('.tally-value-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var panel = btn.closest('.tally-panel');
          var value = parseInt(btn.dataset.value, 10) || 0;
          panel.dataset.entered = String(value);
          panel.dataset.locked = '1';
          var display = panel.querySelector('.tally-display');
          display.textContent = String(value);
          tallyPulse(display);
        });
      });

      el.querySelectorAll('.tally-undo-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var panel = btn.closest('.tally-panel');
          var history = JSON.parse(panel.dataset.history || '[]');
          if(!history.length) return;
          var last = history.pop();
          panel.dataset.history = JSON.stringify(history);
          var subtotal = (parseInt(panel.dataset.subtotal, 10) || 0) - last;
          panel.dataset.subtotal = String(subtotal);
          panel.querySelector('.tally-subtotal').textContent = String(subtotal);
          tallyRenderHistory(panel);
        });
      });

      el.querySelectorAll('.tally-close-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          btn.closest('.tally-panel').hidden = true;
        });
      });

      el.querySelectorAll('.tally-add-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          var panel = btn.closest('.tally-panel');
          var subtotal = parseInt(panel.dataset.subtotal, 10) || 0;
          if(subtotal === 0) return;
          var playerId = panel.id.replace('tally-panel-', '');
          var input = el.querySelector('.round-score-input[data-player="'+playerId+'"]');
          if(!input) return;
          var current = parseInt(input.value, 10) || 0;
          input.value = current + subtotal;
          panel.dataset.subtotal = '0';
          panel.dataset.history = '[]';
          panel.dataset.entered = '0';
          panel.dataset.locked = '0';
          panel.querySelector('.tally-subtotal').textContent = '0';
          panel.querySelector('.tally-display').textContent = '0';
          tallyRenderHistory(panel);
        });
      });
    }

    el.querySelectorAll('[data-del-round]').forEach(function(btn){
      btn.addEventListener('click', function(){
        match.rounds.splice(parseInt(btn.dataset.delRound,10), 1);
        save(); renderMatch();
      });
    });

    var discardBtn = el.querySelector('#discard-match-btn');
    if(discardBtn) discardBtn.addEventListener('click', function(){
      showConfirm(t('discard_match_confirm'), function(){
        state.activeMatches = state.activeMatches.filter(function(m){ return m.id!==match.id; });
        state.activeMatchId = null;
        save(); renderMatch();
      });
    });

    var pauseBtn = el.querySelector('#pause-match-btn');
    if(pauseBtn) pauseBtn.addEventListener('click', function(){
      state.activeMatchId = null;
      save(); renderMatch();
    });

    var finishBtn = el.querySelector('#finish-match-btn');
    if(finishBtn) finishBtn.addEventListener('click', function(){
      showConfirm(t('finish_match_confirm'), function(){
        var best = match.playerIds[0];
        match.playerIds.forEach(function(id){ if(totals[id] > totals[best]) best = id; });
        match.finished = true;
        match.finishedAt = Date.now();
        match.winnerId = best;
        match.totals = totals;
        state.matches.unshift(match);
        state.activeMatches = state.activeMatches.filter(function(m){ return m.id!==match.id; });
        state.activeMatchId = null;
        save();
        renderMatch();
      });
    });

    var saveBtn = el.querySelector('#save-match-btn');
    if(saveBtn) saveBtn.addEventListener('click', function(){
      match.finished = true;
      match.finishedAt = Date.now();
      match.winnerId = winnerId;
      match.totals = totals;
      state.matches.unshift(match);
      state.activeMatches = state.activeMatches.filter(function(m){ return m.id!==match.id; });
      state.activeMatchId = null;
      save();
      renderMatch();
    });
  }

  // ================= HISTORY =================
  var historyDetailId = null;

  function renderHistory(){
    var el = document.getElementById('view-history');
    if(historyDetailId){
      renderHistoryDetail(el, historyDetailId);
      return;
    }
    if(!state.matches.length){
      el.innerHTML = '<div class="card"><div class="empty">'+t('no_matches_empty')+'</div></div>';
      return;
    }
    var rows = state.matches.map(function(m){
      var date = new Date(m.finishedAt || m.startedAt);
      var names = m.playerIds.map(playerName).join(', ');
      return '<div class="card hist-item" data-match="'+m.id+'">' +
        '<div class="row">' +
          '<div class="grow">' +
            '<div style="font-weight:600;">🏆 '+esc(playerName(m.winnerId))+'</div>' +
            '<div class="muted">'+esc(names)+'</div>' +
          '</div>' +
          '<div style="text-align:right;">' +
            '<div class="muted">'+date.toLocaleDateString()+'</div>' +
            '<div class="muted">'+t('rounds_count',{n:m.rounds.length})+'</div>' +
          '</div>' +
          '<button class="icon danger" data-delete-match="'+m.id+'" title="'+t('delete_match_title')+'" aria-label="'+t('delete_match_aria')+'">✕</button>' +
        '</div>' +
      '</div>';
    }).join('');
    el.innerHTML = '<div class="sectionhead"><h2 style="font-size:18px;">'+t('match_history_heading')+'</h2><span class="muted">'+t('finished_count',{n:state.matches.length})+'</span></div>' + rows;

    el.querySelectorAll('[data-delete-match]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.dataset.deleteMatch;
        showConfirm(t('delete_match_confirm'), function(){
          state.matches = state.matches.filter(function(x){return x.id!==id;});
          save(); renderHistory();
        });
      });
    });
    el.querySelectorAll('[data-match]').forEach(function(card){
      card.addEventListener('click', function(){
        historyDetailId = card.dataset.match;
        renderHistory();
      });
    });
  }

  function renderHistoryDetail(el, matchId){
    var m = state.matches.find(function(x){return x.id===matchId;});
    if(!m){ historyDetailId=null; renderHistory(); return; }
    var running = roundRunningTotals(m);
    var totals = m.totals || computeTotals(m);
    var tiles = m.playerIds.map(function(id){
      var isWinner = id===m.winnerId;
      var isFirst = m.firstPlayerId === id;
      return '<div class="total-tile '+(isWinner?'leader':'')+'">' +
        '<div class="name">'+(isFirst?'🎲 ':'')+'<span class="dot" style="background:'+colorFor(id)+';display:inline-block;margin-right:5px;vertical-align:middle;"></span>'+esc(playerName(id))+'</div>' +
        '<div class="score">'+totals[id]+'</div>' +
      '</div>';
    }).join('');
    var historyWinLimit = m.winLimit || LIMIT;
    var roundRows = m.rounds.map(function(round, idx){
      var cum = running[idx];
      var winnerOfRound = roundWinner(m, round);
      var pts = winnerOfRound ? (round.scores[winnerOfRound]||0) : 0;
      var toGo = winnerOfRound ? historyWinLimit - cum[winnerOfRound] : null;
      return '<tr>' +
        '<td>'+(idx+1)+'</td>' +
        '<td><span class="dot" style="background:'+(winnerOfRound?colorFor(winnerOfRound):'transparent')+';display:inline-block;margin-right:5px;vertical-align:middle;"></span>'+(winnerOfRound?esc(playerName(winnerOfRound)):'—')+'</td>' +
        '<td class="num">'+pts+'</td>' +
        '<td class="num">'+(toGo===null?'—':(toGo>0?'<span class="running">'+t('to_go',{n:toGo})+'</span>':'<span class="running">'+t('reached_limit',{limit:historyWinLimit})+'</span>'))+'</td>' +
      '</tr>';
    }).join('');
    var date = new Date(m.finishedAt || m.startedAt);

    el.innerHTML =
      '<button class="back" id="back-to-list">'+t('back_to_all')+'</button>' +
      '<div class="card">' +
        '<div class="sectionhead"><h2 style="font-size:18px;">'+t('match_on_date',{date:date.toLocaleDateString()})+'</h2>' +
          '<button class="danger" id="delete-match-btn">'+t('delete_btn')+'</button>' +
        '</div>' +
        '<div class="totals-bar">'+tiles+'</div>' +
        (m.firstPlayerId ? '<div class="muted first-move-line">'+t('dealer_label',{name:esc(playerName(m.firstPlayerId))})+'</div>' : '') +
      '</div>' +
      '<div class="card">' +
        '<h3 style="font-size:15px;margin-bottom:10px;">'+t('rounds_subheading')+'</h3>' +
        '<div style="overflow-x:auto;"><table>' +
          '<tr><th>'+t('col_round')+'</th><th>'+t('col_winner')+'</th><th class="num">'+t('col_points')+'</th><th class="num">'+t('col_remaining')+'</th></tr>' +
          roundRows +
        '</table></div>' +
      '</div>';

    el.querySelector('#back-to-list').addEventListener('click', function(){ historyDetailId=null; renderHistory(); });
    el.querySelector('#delete-match-btn').addEventListener('click', function(){
      showConfirm(t('delete_match_confirm'), function(){
        state.matches = state.matches.filter(function(x){return x.id!==matchId;});
        historyDetailId = null;
        save(); renderHistory();
      });
    });
  }
